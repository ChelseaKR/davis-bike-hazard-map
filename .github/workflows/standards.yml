# Standards check — fetches the PINNED portfolio-standards at build time and
# runs the freshness and conformance gates. Nothing from portfolio-standards is committed into
# this repo; the standards exist only on the runner (.standards/, gitignored).
#
# Requires the repo secret STANDARDS_DEPLOY_KEY (the read-only deploy key's
# private half). Installed by automation/ci-fetch/install.sh.
name: standards

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this job only reads. No write scope is granted to GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  # Key pull requests on the ref and pushes on the commit.
  #
  # A concurrency group holds one running run and one pending run. A third run
  # joining the group cancels the pending one before it dispatches a single job,
  # so that commit ends `cancelled` with zero jobs and no verdict at all. Keyed
  # only on `github.ref`, every push to the default branch shared one group with
  # the merge before it, so a burst of merges lost the middle ones.
  #
  # Measured 2026-09-05 over the 100 most recent runs on `main`: 13 ended
  # `cancelled`. `standards` is a required status check on `main`.
  #
  # Keying pushes on the SHA gives every merge its own group, so pushes never
  # contend. Pull requests keep the shared `-pr` key, so pushing again to a PR
  # still cancels the previous, now-irrelevant run; `cancel-in-progress` is left
  # exactly as it was, and is now unreachable for pushes.
  group: standards-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch pinned standards (private, read-only deploy key)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ChelseaKR/portfolio-standards
          ref: v2.0.0                      # bump in lockstep with .standards-version
          ssh-key: ${{ secrets.STANDARDS_DEPLOY_KEY }}
          path: .standards
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Standards freshness gate
        run: python3 .standards/automation/check_staleness.py --standards-dir .standards

      - name: Standards conformance gate
        run: python3 scripts/check-portfolio-conformance.py --standards-dir .standards
