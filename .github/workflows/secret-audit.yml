name: secret-audit

# SEC-19: a scheduled, full-git-history secret scan. This
# complements the two diff-scoped gitleaks gates already in place (Gate 1:
# .husky/pre-commit; Gate 2: ci.yml's `security` job, which only diffs the
# current push/PR) by periodically re-scanning the *entire* history for
# credentials that were valid at commit time but weren't caught by either
# diff-scoped gate (e.g. a secret introduced before gitleaks was added, or
# force-push history rewrites). It reports on all three of TruffleHog's result
# tiers, because a credential that leaked and was then revoked is `unverified`,
# not `verified` — see the long note on `extra_args` below.
on:
  schedule:
    - cron: '0 8 * * 1' # Mondays 08:00 UTC (after CodeQL's 07:00 run)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-audit
  cancel-in-progress: false

jobs:
  trufflehog:
    name: TruffleHog (full history, all result tiers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # full history — this is the point of the scheduled scan
          persist-credentials: false
      # LANE 1 — every result tier, with the one path whose only finding is a
      # local-dev placeholder excluded. See both notes below.
      - name: TruffleHog full-history scan (all result tiers)
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c  # v3.97.4
        with:
          # MUST equal the version in the `uses:` comment above. This input
          # selects which TruffleHog BINARY the action downloads, and Dependabot
          # never touches `with:` inputs — so a bump that moves only the action
          # ref changes nothing about what actually scans. That drift is not
          # hypothetical: #105 fixed it by hand, and #130, #144 and #154 then
          # re-introduced it, leaving five "upgrades" scanning with 3.96.0.
          # Guard 4 in workflow-lint.yml now fails the build when the two
          # disagree, so this can no longer drift silently.
          version: 3.97.4
          # `--results=verified,unknown,unverified` is load-bearing; the
          # `--only-verified` this used to pass could not fail on the case the
          # job exists for. TruffleHog sorts a finding into three tiers:
          # `verified` (it authenticated the credential against the live
          # service), `unknown` (verification errored out), and `unverified`
          # (it asked, and the service said no). A credential that leaked and
          # was then REVOKED — the normal end state of a real leak, and
          # precisely what a scheduled full-history sweep is for — answers
          # "no", so it lands in `unverified`. Measured 2026-09-06 on a
          # throwaway clone of this repository at 3.97.4, with a real-shaped
          # AWS key planted in one commit and deleted in the next (confirmed
          # present in history and absent at HEAD before each run):
          #
          #   --only-verified                        exit 0,   0 reported
          #   --results=verified,unknown,unverified  exit 183, unverified_secrets: 1
          #
          # `--results=verified` and `--results=verified,unknown` are the same
          # hole under other names.
          #
          # What the widened tier newly reports over the whole history (3,168
          # chunks, 3.1 MB), measured rather than assumed: exactly one finding,
          # `docker-compose.yml` line 29 —
          #
          #   DATABASE_URL: postgresql://postgres:postgres@db:5432/dbhm
          #
          # — the local stack's own connection string, pointing at the compose
          # service named `db` with Postgres's canonical `postgres:postgres`
          # credentials, in a file that says of its neighbours "Never rely on
          # these defaults outside local dev". It is in history as well as at
          # HEAD, so no edit at HEAD retires it, and TruffleHog offers no
          # per-finding allowlist: the narrowest knob that suppresses it is the
          # path. `--filter-entropy=3.0` was tried first and does not suppress
          # it. Lane 2 below is what keeps that exclusion honest.
          extra_args: --results=verified,unknown,unverified --exclude-globs=docker-compose.yml

      # LANE 2 — the gate exactly as it stood before this change: verified
      # results only, over EVERY path including docker-compose.yml. Its only job
      # is to make lane 1's path exclusion safe. A live credential committed to
      # docker-compose.yml at any point in this history still fails the build
      # here, so widening the tier costs no coverage anywhere; together the two
      # lanes are a strict superset of what this job checked before. It reports
      # nothing today, which is what makes it cheap to keep.
      #
      # `--results=verified` rather than `--only-verified`: the two are
      # equivalent, and stating the tiers explicitly is what lets
      # tests/unit/secretAudit.test.ts read them.
      #
      # `if: !cancelled()` so a failure in lane 1 does not hide lane 2's
      # findings: one run reports everything it can see.
      - name: TruffleHog full-history scan (verified only, every path)
        if: ${{ !cancelled() }}
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c  # v3.97.4
        with:
          # Same pin/version rule as lane 1; workflow-lint.yml's Guard 4 reads
          # both steps and fails if any ref and its `version:` disagree.
          version: 3.97.4
          extra_args: --results=verified
        # No `base`/`head` inputs on a `schedule`/`workflow_dispatch` run, in
        # either lane: the action's own dispatch logic then scans the whole
        # default-branch history rather than a commit range, and `--fail`
        # (always passed by the action) makes the job exit non-zero on any hit
        # in a reported tier.
