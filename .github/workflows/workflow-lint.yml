name: workflow-lint

# SAST for this repository's own CI configuration (CICD-19, RTF-06). zizmor
# audits every input it collects by default: the GitHub Actions workflows, any
# composite action definitions under .github/actions/, the Dependabot config,
# and the pre-commit config. That set is enumerated from the tree in the
# "Enumerate" step below rather than hardcoded, so a newly added workflow or
# action is audited the day it lands instead of silently escaping the gate.
#
# Public repo (2026-07-19): `advanced-security: true` uploads zizmor's SARIF to
# GHAS code scanning so findings surface in the Security tab (and as
# code-scanning PR annotations). The action treats `advanced-security: true` and
# `annotations: true` as mutually exclusive - annotations come from code
# scanning in that mode - so `annotations` is explicitly false there. zizmor
# fails the job on any finding at or above `min-severity` regardless of which
# reporting path is used, so this stays a real, blocking gate either way (the
# flip the 2026-07-05 remediation note deferred until the repo went public -
# P0-3/P0-2).
#
# One pass again, over every input (issue #131)
# ---------------------------------------------
# From 2026-08-21 until 2026-09-07 this ran TWO passes, because release.yml
# pinned a reusable workflow in the PRIVATE sibling repo
# ChelseaKR/portfolio-standards. Any zizmor audit that resolves a
# cross-repository ref could not list that repo's refs with this repo's
# GITHUB_TOKEN, and ABORTED THE WHOLE RUN ("fatal: no audit was performed")
# instead of emitting a finding - so release.yml was audited alone with those
# audits disabled, and everything else kept the full set.
#
# That pin now points at ChelseaKR/.github, which is public. The default
# GITHUB_TOKEN can list its refs, so `impostor-commit`, `stale-action-refs` and
# `ref-version-mismatch` all resolve it like any other pin. The exception has no
# subject left: `.github/zizmor.release-exception.yml` is deleted and the second
# pass is gone, which means every input in this repository is audited under the
# full rule set again, with nothing suppressed anywhere.
#
# The private pin was never the only reason to keep this workflow honest, so the
# guards that survived the simplification are below: the input set is still
# enumerated from the tree rather than hardcoded, an empty collection is still a
# build failure, and the trufflehog pin/version check is untouched.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
      - '.pre-commit-config.yaml'
  pull_request:
    # No path filter: "zizmor (workflow SAST)" is a required status check in
    # the main ruleset, so the context must report on every PR - a
    # path-filtered run never reports and leaves non-workflow PRs unmergeable.

permissions:
  contents: read

concurrency:
  # Key pull requests on the ref and pushes on the commit.
  #
  # A concurrency group holds one running run and one pending run. A third run
  # joining the group cancels the pending one before it dispatches a single job,
  # so that commit ends `cancelled` with zero jobs and no verdict at all. Keyed
  # only on `github.ref`, every push to the default branch shared one group with
  # the merge before it, so a burst of merges lost the middle ones.
  #
  # Measured 2026-09-05 over the 35 most recent runs on `main`: 7 ended
  # `cancelled`. `zizmor (workflow SAST)` is a required status check on `main`.
  #
  # Keying pushes on the SHA gives every merge its own group, so pushes never
  # contend. Pull requests keep the shared `-pr` key, so pushing again to a PR
  # still cancels the previous, now-irrelevant run; `cancel-in-progress` is left
  # exactly as it was, and is now unreachable for pushes.
  group: workflow-lint-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  zizmor:
    # Renaming this job breaks the "zizmor (workflow SAST)" required status
    # check in the main ruleset (docs/ops/branch-ruleset.json).
    name: zizmor (workflow SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # SARIF upload to code scanning (public repo)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Enumerate audit inputs
        id: collect
        run: |
          set -euo pipefail

          # Everything zizmor collects by default, read from the tree so that a
          # new workflow or composite action cannot appear un-audited.
          collected="$(git ls-files -- \
            '.github/workflows/*.yml'       '.github/workflows/*.yaml' \
            '.github/actions/**/action.yml' '.github/actions/**/action.yaml' \
            '.github/dependabot.yml'        '.pre-commit-config.yaml' | sort)"

          if [ -z "${collected}" ]; then
            echo "::error::no audit inputs were collected; this gate would pass without checking anything"
            exit 1
          fi
          echo "Collected $(printf '%s\n' "${collected}" | wc -l | tr -d ' ') input(s):"
          printf '%s\n' "${collected}" | sed 's/^/  /'

          # A cross-repository `uses:` pointing at a PRIVATE repository aborts the
          # whole audit rather than producing a finding, which is what forced the
          # two-pass arrangement this workflow used to carry. Nothing in the tree
          # should reintroduce one: name the file rather than letting the run die
          # as an opaque "fatal: no audit was performed".
          strays="$(printf '%s\n' "${collected}" \
            | xargs -r grep -lE "^[[:space:]]*uses:[[:space:]]*ChelseaKR/portfolio-standards/" || true)"
          if [ -n "${strays}" ]; then
            echo "::error::these inputs pin the private ChelseaKR/portfolio-standards by \`uses:\`,"
            echo "::error::which aborts the audit instead of reporting a finding:"
            printf '%s\n' "${strays}" | sed 's/^/::error::  /'
            echo "::error::Point them at the public ChelseaKR/.github copy, as release.yml does."
            exit 1
          fi

          # trufflehog's `version:` input selects the BINARY the action
          # downloads. Dependabot updates the `uses:` sha and its version
          # comment but never a `with:` input, so the two drift apart and every
          # subsequent bump becomes a no-op that reads like an upgrade. That
          # already happened here: #105 re-synced them by hand, then #130, #144
          # and #154 each moved the ref alone, leaving the scanner pinned at
          # 3.96.0 while the changelog said 3.97.2. A version pin that no longer
          # describes what runs is worse than none, so this is a build failure.
          SECRET_AUDIT='.github/workflows/secret-audit.yml'
          if [ -f "${SECRET_AUDIT}" ]; then
            th_pinned="$(grep -Eo 'trufflesecurity/trufflehog@[0-9a-f]{40}[[:space:]]*#[[:space:]]*v[0-9]+(\.[0-9]+)*' "${SECRET_AUDIT}" \
              | grep -Eo 'v[0-9]+(\.[0-9]+)*$' | tr -d v || true)"
            th_selected="$(grep -Eo '^[[:space:]]+version:[[:space:]]*[0-9]+(\.[0-9]+)*[[:space:]]*$' "${SECRET_AUDIT}" \
              | grep -Eo '[0-9]+(\.[0-9]+)*' || true)"
            if [ -z "${th_pinned}" ] || [ -z "${th_selected}" ]; then
              echo "::error::${SECRET_AUDIT}: could not read both the trufflehog action pin and its \`version:\` input."
              echo "::error::If the step was restructured, update this guard rather than deleting it."
              exit 1
            fi
            if [ "${th_pinned}" != "${th_selected}" ]; then
              echo "::error::${SECRET_AUDIT}: the trufflehog action is pinned to v${th_pinned} but its \`version:\` input downloads ${th_selected}."
              echo "::error::The scan would run ${th_selected}, so the bump to v${th_pinned} is a no-op. Set \`version: ${th_pinned}\`."
              exit 1
            fi
            echo "trufflehog pin and \`version:\` input agree: ${th_pinned}"
          fi

          inputs="$(printf '%s\n' "${collected}" | tr '\n' ' ')"
          echo "audit-inputs=${inputs% }" >> "${GITHUB_OUTPUT}"

      - name: zizmor - the full audit set, over every input
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99  # v0.6.3
        with:
          inputs: ${{ steps.collect.outputs.audit-inputs }}
          min-severity: high
          advanced-security: true
          annotations: false
