name: CodeQL

# Static analysis (SAST) for JS/TS *and* the GitHub Actions workflows
# themselves (CICD-20): runs on PRs into main and weekly so new advisories
# are caught even without code changes. No push:main trigger — the PR run
# already covers every commit that lands on main (CI-CD-STANDARD §11e).
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `actions` scans the workflow YAML itself (CICD-20); no autobuild
        # needed for it since there's no code to compile.
        language: [javascript-typescript, actions]
    # NOTE (2026-07-05 remediation, P0-3/P1-2): this job used to set the
    # job-level escape hatch that silences a failure regardless of outcome
    # (spelled "continue" + "-on-error" + ": true" in YAML), which meant
    # CodeQL could never block a merge for ANY reason, including real
    # findings. That's fixed below: the analyze step writes SARIF locally and
    # a dedicated step parses it and fails the job on any error-level
    # (security) result — the blocking gate lives in-run, not in the upload.
    #
    # NOTE (2026-08-27): that replacement gate could not fail either. It
    # selected results with `.level == "error"`, and CodeQL leaves `level` off
    # a result entirely, inheriting it from the rule's defaultConfiguration —
    # so the count was 0 for every input, including the run that carried a
    # security-severity 7.8 finding. It is now scripts/codeql-gate.mjs, which
    # resolves severity through the rule table, fails closed on a severity it
    # cannot resolve, and is unit-tested against a committed real SARIF.
    #
    # This job is NOT a required status check in docs/ops/branch-ruleset.json,
    # so a red run here does not itself block a merge. Making it required is a
    # repository-settings change, tracked separately.
    # Public repo (2026-07-19): `upload: always` also sends the SARIF to GHAS
    # code scanning so findings surface in the Security tab (visibility only;
    # the in-run gate is what blocks). Tracking issue:
    # audit-2026-07-05/davis-bike-hazard-map-REMEDIATION.md P0-3.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Autobuild
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
      - name: Perform CodeQL analysis (SARIF uploaded to code scanning and written locally, see note above)
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          upload: always
          output: sarif-results
      # The gate is a Node script so it can be unit-tested. Pin the runtime
      # rather than relying on whatever node the runner image happens to ship.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
      - name: Enforce the SAST gate on the parsed SARIF (SEC-08)
        # The gate lives in scripts/codeql-gate.mjs so it can be unit-tested
        # (tests/unit/codeqlGate.test.ts) against a committed, real CodeQL SARIF.
        # It used to be an inline `jq 'select(.level == "error")'`, which matched
        # nothing for every input because CodeQL does not set a level on a
        # result — it inherits it from the rule, and its rules live in
        # tool.extensions, not tool.driver.rules. The gate reported 0 findings
        # while a security-severity 7.8 finding was present. See the script
        # header and .github/codeql-acknowledged.json.
        #
        # The matrix language is an argument because one acknowledgement list
        # serves every leg while each leg sees only its own SARIF. Without it,
        # every leg checked every entry for staleness, so the javascript entry
        # read as stale in the `actions` leg and this job could never be green
        # in both. Passed through env rather than interpolated into the script.
        env:
          ANALYSIS_LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          node scripts/codeql-gate.mjs sarif-results .github/codeql-acknowledged.json "${ANALYSIS_LANGUAGE}"
      - name: Upload SARIF as a build artifact (manual inspection alongside the code-scanning upload — see note above)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results/
          if-no-files-found: warn
