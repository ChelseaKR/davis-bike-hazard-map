version: 2
updates:
  # Application dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk dev/test tooling into one PR to cut noise.
      dev-dependencies:
        dependency-type: development
    labels:
      - dependencies

  # GitHub Actions used by the workflows above.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    # One PR for the whole CodeQL action set: init, analyze, autobuild and
    # upload-sarif must always run the same version. Since CodeQL Action
    # 3.30.4 the non-init steps hard-error when they load a configuration
    # file written by a different version, so a half-applied bump breaks the
    # scan rather than merely warning.
    groups:
      codeql-action:
        patterns:
          - github/codeql-action*
    # There is no `ignore` block here any more, and that is a fix rather than a
    # loosening.
    #
    # From 2026-08-21 to 2026-09-07 this file ignored
    # `ChelseaKR/portfolio-standards/.github/workflows/release-authorize.yml`
    # entirely. `release.yml` pinned a reusable workflow in that *private*
    # repository, Dependabot's repo-scoped credentials could not read it (`403 ...
    # Either the repo doesn't exist, or Dependabot doesn't have access to it`), the
    # updater recorded `git_dependencies_not_reachable` for that one dependency,
    # and a single recorded error failed the whole run -- every scheduled
    # `github_actions` run from 2026-08-28 onward. Ignoring the dependency made
    # Dependabot drop it in `Job#allowed_update?` before building an update
    # checker, so the unreachable fetch never happened and the run exited 0.
    #
    # `release.yml` now pins the public `ChelseaKR/.github` copy instead, for a
    # more serious reason than this one: a public repository cannot *call* a
    # reusable workflow in a private repository at all, so that release workflow
    # could never parse, let alone run. Dependabot can read the public repository,
    # so the fetch that used to fail now succeeds, the entry has nothing left to
    # protect, and the pin is bumped automatically again -- which also removes the
    # hand-maintenance this block used to warn about, where the ignore entry and
    # the `uses:` line could drift apart and bring the weekly failure back
    # silently.
