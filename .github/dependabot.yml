version: 2
updates:
  # Application dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk dev/test tooling into one PR to cut noise.
      dev-dependencies:
        dependency-type: development
    labels:
      - dependencies

  # GitHub Actions used by the workflows above.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    # One PR for the whole CodeQL action set: init, analyze, autobuild and
    # upload-sarif must always run the same version. Since CodeQL Action
    # 3.30.4 the non-init steps hard-error when they load a configuration
    # file written by a different version, so a half-applied bump breaks the
    # scan rather than merely warning.
    groups:
      codeql-action:
        patterns:
          - github/codeql-action*
    # `release.yml` pins a reusable workflow from ChelseaKR/portfolio-standards,
    # a *private* repository. Dependabot's repo-scoped credentials cannot read
    # it: the proxy logs `403 ... Either the repo doesn't exist, or Dependabot
    # doesn't have access to it`, the updater records
    # `git_dependencies_not_reachable` for that one dependency, and a single
    # recorded error fails the entire run even though every other action was
    # checked and its pull requests were opened.
    #
    # This repository's own record: the pin landed in 4cb0e1a4 on 2026-08-21
    # ("fix(release): authorize releases from reviewed main"), and every
    # scheduled `github_actions` updater run since has failed -- 2026-08-28 and
    # 2026-09-04.
    #
    # An `ignore` entry carrying only `dependency-name`, with no `versions` and
    # no `update-types`, means "every version". Dependabot drops such a
    # dependency in `Job#allowed_update?` before it builds an update checker, so
    # the unreachable fetch never happens, no error is recorded, and the run
    # exits 0.
    #
    # What this trades away: this single pin is no longer bumped automatically.
    # It must be bumped by hand whenever portfolio-standards moves the
    # release-authorize workflow, and this entry and the `uses:` line in
    # `release.yml` must be kept in step -- if they drift apart the weekly
    # failure returns silently.
    #
    # To restore automatic updates instead, give Dependabot a credential that
    # can read portfolio-standards: store a fine-grained PAT with read access to
    # that repository as a *Dependabot* secret (that store is separate from the
    # Actions secret store), add a top-level `registries:` block of `type: git`
    # against https://github.com with `username: x-access-token` and that secret
    # as the password, reference the registry from this update entry, and delete
    # this `ignore` block. The organization-level "Grant Dependabot access to
    # private repositories" setting is not an option here: it exists only for
    # organizations, and both repositories are owned by a personal account.
    ignore:
      - dependency-name: ChelseaKR/portfolio-standards/.github/workflows/release-authorize.yml
