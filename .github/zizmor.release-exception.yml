# zizmor configuration for the one audited file that cannot be audited whole:
# .github/workflows/release.yml. Applied by .github/workflows/workflow-lint.yml
# to that file ALONE, never repo-wide.
#
# Why it exists
# -------------
# release.yml's `authorize` job pins a reusable workflow in the PRIVATE sibling
# repository ChelseaKR/portfolio-standards. Two of zizmor's audits resolve a
# pinned SHA by listing the referenced repository's refs over the GitHub API. In
# CI the default GITHUB_TOKEN is scoped to this repository alone, so that
# listing comes back "missing or you have no access" and zizmor aborts the
# entire run rather than emitting a finding:
#
#     fatal: no audit was performed
#     'impostor-commit' audit failed on file://.github/workflows/release.yml
#     Caused by:
#         0: error in 'impostor-commit' audit
#         1: couldn't list tags for ChelseaKR/portfolio-standards
#         2: can't access ChelseaKR/portfolio-standards: missing or you have no access
#
# That is an abort, not a finding. It audited six of the ten workflows and then
# stopped, so the gate reported red while leaving four workflows unexamined.
#
# The two audits that abort
# -------------------------
#   * `impostor-commit` — since zizmor v1.x. Checks that a pinned SHA really
#     belongs to the ref it claims.
#   * `stale-action-refs` — NEW IN zizmor v1.30.0, which zizmor-action v0.6.3
#     ships. Checks whether a pinned SHA still corresponds to a released tag.
#     It fails in exactly the same way and for exactly the same reason:
#
#         fatal: no audit was performed
#         'stale-action-refs' audit failed on file://.github/workflows/release.yml
#         Caused by:
#             0: error in 'stale-action-refs' audit
#             1: couldn't list tags for ChelseaKR/portfolio-standards
#             2: can't access ChelseaKR/portfolio-standards: missing or you have no access
#
#     Any future audit that resolves a cross-repository ref will land here too.
#     The symptom is always `fatal: no audit was performed` naming release.yml
#     and ChelseaKR/portfolio-standards; the fix is to add that audit's name
#     below, never to disable it repo-wide.
#
# Why disabling the rules is the only lever
# -----------------------------------------
# Verified against zizmor v1.29.0 with the referenced repository unreadable by
# the token in use, and re-confirmed against v1.30.0 for `stale-action-refs`:
#
#   * an inline `# zizmor: ignore[impostor-commit]` on the `uses:` line -> still aborts
#   * `rules.impostor-commit.ignore: ['release.yml:48']` in config      -> still aborts
#   * `rules.impostor-commit.disable: true`                             -> completes
#
# The first two filter results; the abort happens before any result exists to
# filter. Disabling is the only thing that avoids it, which is why the audit is
# split into two passes rather than disabling these rules for the whole
# repository.
#
# What it costs
# -------------
# Every `uses:` pin inside release.yml loses impostor-commit and
# stale-action-refs verification, not just the portfolio-standards one. Every
# other file in the repository keeps both. The portfolio-standards pin is
# verified by hand instead, at the `uses:` line.
#
# What removes it
# ---------------
# Make ChelseaKR/portfolio-standards public, or drop the cross-repo pin from
# release.yml. Either one trips the guard step in workflow-lint.yml, which fails
# the build and says to delete this file and audit everything in one pass.
# Tracked in issue #131.
rules:
  impostor-commit:
    disable: true
  # See "The two audits that abort" above. Added with the zizmor-action v0.6.3
  # bump (zizmor v1.30.0), which introduced this audit; without it the exception
  # pass aborts and the required `zizmor (workflow SAST)` check is red.
  stale-action-refs:
    disable: true
